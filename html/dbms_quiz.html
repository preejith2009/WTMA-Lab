<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Bootstrap 5.3 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>DBMS Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins',sans-serif;
    margin:0;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}
.quiz-container{
    width:70%;
    max-width:1000px;
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 20px 40px rgba(35,29,29,.3);
    animation:fadeIn 1s ease;
}
h2{margin-bottom:20px; white-space:pre-wrap;}
.option{
    display:block;
    margin:12px 0;
    padding:14px;
    background:#f3f3f3;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
    white-space:pre-wrap;
    line-height:1.5;
}
.option:hover{
    background:#dfe9ff;
    transform:scale(1.02);
}
.option input{margin-right:10px;}
button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    background:linear-gradient(45deg,#42a5f5,#478ed1);
    color:white;
    font-size:16px;
    border-radius:10px;
    cursor:pointer;
}
.result-card{
    text-align:center;
    padding:40px;
    border-radius:16px;
    background:linear-gradient(135deg,#43cea2,#185a9d);
    color:white;
    animation:zoomIn 1s ease;
}
.score{
    font-size:50px;
    font-weight:bold;
    margin:20px 0;
}
.bar{
    width:100%;
    height:20px;
    background:#ffffff55;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}
.fill{
    height:100%;
    width:0%;
    background:#00ffcc;
    animation:fillBar 2s forwards;
}
.review-box{
    background:#fff;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    line-height:1.5;
}
.review-box pre{
    background:#f5f5f5;
    padding:10px;
    border-radius:8px;
    overflow:auto;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;}
}
@keyframes zoomIn{
    from{transform:scale(.5);opacity:0;}
    to{transform:scale(1);}
}
@keyframes fillBar{
    from{width:0;}
    to{width:var(--percent);}
}
@media(max-width:700px){
    .quiz-container{width:88%;padding:20px;}
    h2{font-size:20px;}
    .option{font-size:14px;}
}
</style>
</head>

<body>
<div class="quiz-container">
    <div id="quiz"></div>
    <button id="nextBtn">Next</button>
    <div id="result"></div>
    <div id="review"></div>
</div>

<script>
const quizData = [
{
q:`1. Rename the column CGPA to Grade_Point.`,
a:[
`ALTER TABLE STUDENT
RENAME COLUMN CGPA TO Grade_Point;`,
`ALTER TABLE STUDENT
MODIFY COLUMN CGPA TO Grade_Point;`,
`UPDATE TABLE STUDENT
RENAME CGPA AS Grade_Point;`,
`ALTER TABLE STUDENT
CHANGE COLUMN Grade_Point TO CGPA;`
],
correct:0
},
{
q:`2. Modify the City column to increase its length.`,
a:[
`ALTER TABLE STUDENT
CHANGE City VARCHAR(50);`,
`ALTER TABLE STUDENT
MODIFY City VARCHAR(50);`,
`ALTER TABLE STUDENT
UPDATE City VARCHAR(50);`,
`ALTER TABLE STUDENT
ALTER City SIZE 50;`
],
correct:1
},
{
q:`3. Remove the Email column from the STUDENT table.`,
a:[
`ALTER TABLE STUDENT
DELETE COLUMN Email;`,
`DROP TABLE STUDENT
COLUMN Email;`,
`ALTER TABLE STUDENT
DROP COLUMN Email;`,
`ALTER STUDENT
REMOVE COLUMN Email;`
],
correct:2
},
{
q:`4. Display only Student_Name and Department.`,
a:[
`SELECT Student_Name, Department
FROM STUDENT;`,
`SELECT Student_Name AND Department
FROM STUDENT;`,
`SELECT Student_Name, Department
FROM COURSE;`,
`DISPLAY Student_Name, Department
FROM STUDENT;`
],
correct:0
},
{
q:`5. Update Rahul's city to Mumbai.`,
a:[
`UPDATE STUDENT
SET City = 'Mumbai'
WHERE Student_Name = 'Rahul';`,
`UPDATE STUDENT
SET Student_Name = 'Mumbai'
WHERE City = 'Rahul';`,
`UPDATE STUDENT
CHANGE City = 'Mumbai'
WHERE Student_Name = 'Rahul';`,
`ALTER TABLE STUDENT
SET City = 'Mumbai'
WHERE Student_Name = 'Rahul';`
],
correct:0
},
{
q:`6. Display students whose CGPA is greater than 8.`,
a:[
`SELECT *
FROM STUDENT
WHERE CGPA >= 8;`,
`SELECT *
FROM STUDENT
WHERE CGPA > 8;`,
`SELECT *
FROM STUDENT
WHERE CGPA < 8;`,
`SELECT *
FROM STUDENT
HAVING CGPA > 8;`
],
correct:1
},
{
q:`7. Display all courses with more than 3 credits.`,
a:[
`SELECT *
FROM COURSE
WHERE Credits >= 3;`,
`SELECT *
FROM COURSE
WHERE Credits < 3;`,
`SELECT *
FROM COURSE
WHERE Credits > 3;`,
`SELECT *
FROM STUDENT
WHERE Credits > 3;`
],
correct:2
},
{
q:`8. Count the total number of students.`,
a:[
`SELECT COUNT(Student_ID) AS Total_Students
FROM STUDENT;`,
`SELECT COUNT(*) AS Total_Students
FROM STUDENT;`,
`SELECT SUM(*) AS Total_Students
FROM STUDENT;`,
`SELECT TOTAL(*) AS Total_Students
FROM STUDENT;`
],
correct:1
},
{
q:`9. Count the number of students in the CSE department.`,
a:[
`SELECT COUNT(*) AS CSE_Students
FROM STUDENT
WHERE Department = 'CSE';`,
`SELECT COUNT(*) AS CSE_Students
FROM STUDENT
WHERE Department = CSE;`,
`SELECT COUNT(CSE) AS CSE_Students
FROM STUDENT;`,
`SELECT SUM(*) AS CSE_Students
FROM STUDENT
WHERE Department = 'CSE';`
],
correct:0
},
{
q:`10. Find the lowest marks obtained.`,
a:[
`SELECT MIN(Marks) AS Lowest_Marks
FROM ENROLLMENT;`,
`SELECT MAX(Marks) AS Lowest_Marks
FROM ENROLLMENT;`,
`SELECT LOW(Marks) AS Lowest_Marks
FROM ENROLLMENT;`,
`SELECT AVG(Marks) AS Lowest_Marks
FROM ENROLLMENT;`
],
correct:0
},
{
q:`11. Display the average marks of all students.`,
a:[
`SELECT SUM(Marks) AS Average_Marks
FROM ENROLLMENT;`,
`SELECT AVG(Marks) AS Average_Marks
FROM ENROLLMENT;`,
`SELECT MEAN(Marks) AS Average_Marks
FROM ENROLLMENT;`,
`SELECT AVERAGE(Marks) AS Average_Marks
FROM ENROLLMENT;`
],
correct:1
},
{
q:`12. Update the Marks of the student whose Student_ID is 102 and Course_ID is C104 to 100.`,
a:[
`UPDATE ENROLLMENT
SET Marks = 100
WHERE Student_ID = 102
AND Course_ID = 'C104';`,
`UPDATE ENROLLMENT
SET Marks = 100
WHERE Student_ID = 102
OR Course_ID = 'C104';`,
`ALTER ENROLLMENT
SET Marks = 100
WHERE Student_ID = 102
AND Course_ID = 'C104';`,
`UPDATE ENROLLMENT
SET Marks = 'C104'
WHERE Student_ID = 102
AND Course_ID = 100;`
],
correct:0
},
{
q:`13. Display the details of the student who has the lowest CGPA.`,
a:[
`SELECT *
FROM STUDENT
WHERE CGPA = (
    SELECT MIN(CGPA)
    FROM STUDENT
);`,
`SELECT *
FROM STUDENT
WHERE CGPA = (
    SELECT MAX(CGPA)
    FROM STUDENT
);`,
`SELECT *
FROM STUDENT
WHERE CGPA > (
    SELECT MIN(CGPA)
    FROM STUDENT
);`,
`SELECT MIN(*)
FROM STUDENT
WHERE CGPA = MIN(CGPA);`
],
correct:0
},
{
q:`14. Display the course name for the course enrolled by Student_ID 101.`,
a:[
`SELECT Course_Name
FROM COURSE
WHERE Course_ID IN (
    SELECT Course_ID
    FROM ENROLLMENT
    WHERE Student_ID = 101
);`,
`SELECT Course_Name
FROM COURSE
WHERE Course_ID IN (
    SELECT Course_ID
    FROM ENROLLMENT
    WHERE Student_ID = 102
);`,
`SELECT Course_Name
FROM COURSE
WHERE Course_ID = 'C101';`,
`SELECT *
FROM COURSE
WHERE Course_ID IN (
    SELECT Student_ID
    FROM ENROLLMENT
    WHERE Course_ID = 'C101'
);`
],
correct:0
},
{
q:`15. Display the details of students who are enrolled in Java Programming.`,
a:[
`SELECT *
FROM STUDENT
WHERE Student_ID IN (
    SELECT Student_ID
    FROM ENROLLMENT
    WHERE Course_ID = (
        SELECT Course_ID
        FROM COURSE
        WHERE Course_Name = 'Java Programming'
    )
);`,
`SELECT *
FROM STUDENT
WHERE Student_ID IN (
    SELECT Student_ID
    FROM ENROLLMENT
    WHERE Course_ID = (
        SELECT Course_ID
        FROM COURSE
        WHERE Course_Name = 'Python Programming'
    )
);`,
`SELECT *
FROM STUDENT
WHERE Course_ID IN (
    SELECT Course_ID
    FROM COURSE
    WHERE Course_Name = 'Java Programming'
);`,
`SELECT *
FROM STUDENT
WHERE Student_ID = (
    SELECT Student_ID
    FROM ENROLLMENT
    WHERE Course_ID = (
        SELECT Course_ID
        FROM COURSE
        WHERE Course_Name = 'Java Programming'
    )
);`
],
correct:0
},
{
q:`16. Display the details of students who are not enrolled in any course.`,
a:[
`SELECT *
FROM STUDENT
WHERE Student_ID IN (
    SELECT Student_ID
    FROM ENROLLMENT
);`,
`SELECT *
FROM STUDENT
WHERE Student_ID NOT IN (
    SELECT Student_ID
    FROM ENROLLMENT
);`,
`SELECT *
FROM STUDENT
WHERE Student_ID NOT EXISTS (
    SELECT Student_ID
    FROM ENROLLMENT
);`,
`SELECT *
FROM STUDENT
WHERE Student_ID <> (
    SELECT Student_ID
    FROM ENROLLMENT
);`
],
correct:1
}
];

let index=0;
let score=0;
let userAnswers=[];

const quiz=document.getElementById("quiz");
const nextBtn=document.getElementById("nextBtn");

function escapeHTML(str){
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function loadQuestion(){
    let q=quizData[index];

    quiz.innerHTML=`
        <h2>${escapeHTML(q.q)}</h2>
        ${q.a.map((opt,i)=>
        `<label class="option">
            <input type="radio" name="opt" value="${i}">
            <span>${escapeHTML(opt)}</span>
        </label>`).join("")}
    `;

    nextBtn.innerText=index===quizData.length-1?"Submit":"Next";
}

nextBtn.onclick=function(){
    let sel=document.querySelector('input[name="opt"]:checked');

    if(!sel){
        alert("Select an answer");
        return;
    }

    userAnswers[index]=Number(sel.value);

    if(userAnswers[index]===quizData[index].correct) score++;

    index++;

    if(index<quizData.length) loadQuestion();
    else showResult();
};

function showResult(){
    let percent=Math.round((score/quizData.length)*100);

    quiz.style.display="none";
    nextBtn.style.display="none";

    document.getElementById("result").innerHTML=`
        <div class="result-card">
            <h1>🎉 Quiz Completed 🎉</h1>
            <div class="score" id="scoreCount">0</div>
            <p>You scored ${score} out of ${quizData.length}</p>
            <div class="bar">
                <div class="fill" style="--percent:${percent}%"></div>
            </div>
            <p>${percent}%</p>
            <button id="retryBtn" onclick="restartQuiz()">
    🔄 Take Quiz Again
</button>
        </div>
    `;

    animateScore(score);
    showReview();
}

function animateScore(finalScore){
    let count=0;
    let el=document.getElementById("scoreCount");

    let interval=setInterval(()=>{
        el.innerText=count;
        if(count===finalScore) clearInterval(interval);
        count++;
    },70);
}

function showReview(){
    let reviewHTML="<h2 style='margin-top:40px'>Answer Review</h2>";

    quizData.forEach((q,i)=>{
        let userAns=userAnswers[i];
        let correctAns=q.correct;

        reviewHTML+=`
        <div class="review-box">
            <b>${escapeHTML(q.q)}</b><br><br>
            <strong>Your Answer:</strong>
            <span style="color:${userAns===correctAns?'green':'red'}">
                ${userAns!==undefined ? escapeHTML(q.a[userAns]) : "Not Answered"}
            </span><br><br>
            <strong>Correct Answer:</strong>
            <span style="color:green">
                ${escapeHTML(q.a[correctAns])}
            </span>
        </div>`;
    });

    document.getElementById("review").innerHTML=reviewHTML;
}

function restartQuiz(){

    // Reset quiz variables
    index = 0;
    score = 0;
    userAnswers = [];

    // Clear result and answer review
    document.getElementById("result").innerHTML = "";
    document.getElementById("review").innerHTML = "";

    // Show quiz again
    quiz.style.display = "block";
    nextBtn.style.display = "inline-block";

    // Load first question
    loadQuestion();

    // Scroll to top
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

loadQuestion();
</script>

</body>
</html>
